name: 매일 초안

on:
  schedule:
    # 07:00 KST = 22:00 UTC (전날)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '이번만 쓸 궁금증 (궁금증 | 유형 | 분야 | 전제). 비우면 topics.md 큐에서 꺼냅니다'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 초안 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic }}
        run: npm run draft

      - name: 커밋
        run: |
          if [ -z "$(git status --porcelain drafts topics.md)" ]; then
            echo "바뀐 게 없어 커밋을 건너뜁니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts topics.md
          git commit -m "오늘의 초안을 만든다."
          git push
